services:
  bot:
    image: ghcr.io/andrewkirkovski/polish-rent-bot:latest
    container_name: polish-rent-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-data:/app/data
    ports:
      # Bind dashboard to loopback only — reach via SSH tunnel.
      - "127.0.0.1:8080:8080"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  bot-data:
