services:
  bot:
    image: ghcr.io/andrewkirkovski/polish-rent-bot:latest
    container_name: polish-rent-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-data:/app/data
    ports:
      # Bind dashboard to loopback only — reach via SSH tunnel.
      # Host 8080 is taken on the Revo box (host-network HTTP service alongside jellyfin),
      # so publish on host 8090 → container 8080.
      - "127.0.0.1:8090:8080"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  bot-data:
